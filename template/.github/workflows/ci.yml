name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore __NAME__.sln
      - name: Build
        run: dotnet build __NAME__.sln -c Release --no-restore
      - name: Test
        run: dotnet test __NAME__.sln -c Release --no-build --verbosity normal
